<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flor de Maria</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#f1f4f9;color:#1f2933}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{background:#a85400;color:#fff;padding:22px 0}
.head{display:flex;align-items:center;gap:18px}
.head img{max-height:72px;max-width:200px;background:#fff;border-radius:10px;padding:6px}
h1{margin:0;font-size:26px}
.sub{margin:4px 0 0;opacity:.92}
#busca{width:100%;margin:20px 0;padding:12px 14px;font-size:16px;border:1px solid #c9d1d9;border-radius:10px;background:#ffffff;color:#1f2933}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:#ffffff;border:1px solid #c9d1d9;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.foto{position:relative;aspect-ratio:1/1;background:#f1f4f9;display:flex;align-items:center;justify-content:center;font-size:56px;cursor:zoom-in;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.nome{font-weight:700;font-size:16px}
.desc{font-size:14px;color:#6b7280;flex:1}
.preco{font-size:19px;font-weight:700;color:#a85400}
.qtd{display:flex;align-items:center;gap:10px;margin-top:6px}
.qtd button{width:36px;height:36px;border:0;border-radius:8px;background:#a85400;color:#fff;font-size:20px;cursor:pointer}
.qtd span{min-width:24px;text-align:center;font-weight:700}
.barra{position:fixed;left:0;right:0;bottom:0;background:#ffffff;border-top:1px solid #c9d1d9;box-shadow:0 -4px 16px rgba(0,0,0,.15);padding:12px 16px}
.barra .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.enviar{background:#25d366;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}
.vazio{text-align:center;color:#6b7280;padding:40px 0}
footer{color:#6b7280;font-size:13px;text-align:center;padding:24px 0 120px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:10;cursor:zoom-out}
.zoom img{max-width:92vw;max-height:88vh;border-radius:8px}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:30px;cursor:pointer}
.seta.e{left:6px}.seta.d{right:6px}
.pontos{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.pontos i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}
.pontos i.on{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.zs{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:30px;line-height:44px;padding:0;cursor:pointer}
.zs.e{left:14px}.zs.d{right:14px}
.zc{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-weight:700}
[hidden]{display:none!important}
</style></head><body>
<header><div class="wrap head"><div><h1>Flor de Maria</h1><p class="sub">Confira nossos produtos!</p></div></div></header>
<div class="wrap">
<input id="busca" type="search" placeholder="Buscar produto...">
<div id="grade" class="grade"></div>
<p id="vazio" class="vazio" hidden>Nenhum produto encontrado.</p>
<footer>Flor de Maria • atualizado em 20/10/2026. Escolha os produtos e envie o pedido pelo WhatsApp.</footer>
</div>
<div id="barra" class="barra" hidden><div class="in"><strong id="resumo"></strong>
<button class="enviar" id="enviar">Enviar pedido pelo WhatsApp</button></div></div>
<div id="zoom" class="zoom" hidden><img id="zoomimg" alt=""><button class="zs e" id="zprev" aria-label="Anterior">&#8249;</button><button class="zs d" id="znext" aria-label="Pr&oacute;xima">&#8250;</button><span class="zc" id="zcont"></span></div>
<script>const PRODUTOS=[{"id": 0, "nome": "N S FATIMA FLOR 12CM", "desc": "", "preco": 27.6, "fotos": []}, {"id": 1, "nome": "CHAVEIRO ANJO", "desc": "", "preco": 5.78, "fotos": []}, {"id": 2, "nome": "CHAVEIRO MINI PORTA JOIA", "desc": "", "preco": 8.6, "fotos": []}, {"id": 3, "nome": "CHAVEIRO SUPORTE DE CELULAR G", "desc": "", "preco": 10.09, "fotos": []}, {"id": 4, "nome": "MARCA PAGINA N S AP 12,1CM", "desc": "", "preco": 4.37, "fotos": []}, {"id": 5, "nome": "GANCHO DE PAREDE", "desc": "", "preco": 7.31, "fotos": []}, {"id": 6, "nome": "COLETOR DE PO P/ FURADEIRA", "desc": "", "preco": 19.14, "fotos": []}, {"id": 7, "nome": "FIVELA DE CINTO CARRO", "desc": "", "preco": 6.64, "fotos": []}, {"id": 8, "nome": "PORTA CONTROLE REMOTO DUPLO", "desc": "PORTA CONTROLE REMOTO DUPLO", "preco": 31.53, "fotos": []}, {"id": 9, "nome": "PORTA CELULAR MAÇA", "desc": "", "preco": 103.74, "fotos": []}, {"id": 10, "nome": "PORTA LAPIS MAÇA", "desc": "", "preco": 25.44, "fotos": []}, {"id": 11, "nome": "PORTA CELULAR SLIM G", "desc": "", "preco": 10.75, "fotos": []}, {"id": 12, "nome": "PORTA CELULAR ELEGANTE", "desc": "", "preco": 17.51, "fotos": []}, {"id": 13, "nome": "CHAVEIRO CORAÇÃO ARTICULADO", "desc": "", "preco": 5.42, "fotos": []}, {"id": 14, "nome": "CHAVEIRO ARTICULADO CRUZ GIRATORIA", "desc": "", "preco": 13.59, "fotos": []}, {"id": 15, "nome": "BANDEJA G DECOR", "desc": "", "preco": 69.52, "fotos": []}, {"id": 16, "nome": "KIT PORTA GUARDANAPO NATAL", "desc": "", "preco": 22.51, "fotos": []}, {"id": 17, "nome": "SUPORTE ANJO E POMBA BATIZADO", "desc": "", "preco": 15.96, "fotos": []}, {"id": 18, "nome": "ANJO 8,3", "desc": "", "preco": 19.26, "fotos": []}, {"id": 19, "nome": "ANJO 20CM", "desc": "", "preco": 67.14, "fotos": []}, {"id": 20, "nome": "PORTA GUARDANAPO HOHOHO", "desc": "", "preco": 25.13, "fotos": []}, {"id": 21, "nome": "ROGAI POR NOS APARECIDA", "desc": "", "preco": 27.12, "fotos": []}, {"id": 22, "nome": "MINI NOSSA SENHORA", "desc": "", "preco": 9.25, "fotos": []}, {"id": 23, "nome": "BANDEJA P", "desc": "", "preco": 30.8, "fotos": []}, {"id": 24, "nome": "PORTA VELA", "desc": "", "preco": 9.72, "fotos": []}, {"id": 25, "nome": "MINI CRUZ E BIBLIA", "desc": "", "preco": 9.43, "fotos": []}, {"id": 26, "nome": "CRUZ VAZADA PRESEPIO", "desc": "", "preco": 22.22, "fotos": []}, {"id": 27, "nome": "N SENHORA APARECIDA", "desc": "", "preco": 28.63, "fotos": []}, {"id": 28, "nome": "LETREIRO FELIZ NATAL", "desc": "", "preco": 24.88, "fotos": []}, {"id": 29, "nome": "ARVORE NATAL TRAD", "desc": "", "preco": 37.3, "fotos": []}, {"id": 30, "nome": "KIT PETISQUEIRA NATAL", "desc": "", "preco": 56.9, "fotos": []}, {"id": 31, "nome": "ANJO 8CM COM CX ACETATO", "desc": "", "preco": 18.78, "fotos": []}, {"id": 32, "nome": "ANJO 25CM", "desc": "", "preco": 98.75, "fotos": []}, {"id": 33, "nome": "MINI LACO PORTA FOTO", "desc": "", "preco": 7.01, "fotos": []}, {"id": 34, "nome": "SUPORTE LACO POLAROID", "desc": "", "preco": 12.18, "fotos": []}, {"id": 35, "nome": "LACO DECORATIVO", "desc": "", "preco": 12.37, "fotos": []}, {"id": 36, "nome": "VASO ESPIRAL 12,6CM", "desc": "", "preco": 14.51, "fotos": []}, {"id": 37, "nome": "VASO ESPIRAL 15CM", "desc": "", "preco": 17.5, "fotos": []}, {"id": 38, "nome": "BANDEJA 20CM", "desc": "", "preco": 26.16, "fotos": []}, {"id": 39, "nome": "PORTA TERCO 12CM", "desc": "MATERIAL 3D", "preco": 29.19, "fotos": []}, {"id": 42, "nome": "SAGRADA FAMILIA BUSTO12CM", "desc": "", "preco": 29.8, "fotos": []}, {"id": 43, "nome": "SAGRADA FAMILIA BUSTO 15CM", "desc": "", "preco": 59.74, "fotos": []}, {"id": 44, "nome": "SAGRADA FAMILIA BUSTO 20CM", "desc": "SUPORTE DE MESA OU DE PAREDE", "preco": 114.84, "fotos": []}, {"id": 45, "nome": "PORTA LAPIS CORUJA", "desc": "CORES VARIADAS", "preco": 34.02, "fotos": []}, {"id": 46, "nome": "NOSSA SENHORA APARECIDA 11CM", "desc": "MANTO COLORIDO", "preco": 16.39, "fotos": []}, {"id": 47, "nome": "KIT 4 PORTA FOTO PARA ARVORE DE NATAL", "desc": "VARIAS CORES", "preco": 19.9, "fotos": []}, {"id": 48, "nome": "LETREIRO FELIZ NATAL", "desc": "", "preco": 19.8, "fotos": []}, {"id": 49, "nome": "ANJO 10CM", "desc": "", "preco": 15.95, "fotos": []}, {"id": 50, "nome": "ANJO 12CM", "desc": "", "preco": 21.35, "fotos": []}, {"id": 51, "nome": "ANJO 15CM", "desc": "", "preco": 28.22, "fotos": []}];const CFG={"whatsapp": "5582981690060", "precos": true};
const fmt=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
const carrinho={},qtdEls={};
const grade=document.getElementById('grade');
function atualizarBarra(){
  let itens=0,tot=0;
  for(const p of PRODUTOS){const q=carrinho[p.id]||0;itens+=q;tot+=q*p.preco;}
  document.getElementById('barra').hidden=!(CFG.whatsapp&&itens>0);
  document.getElementById('resumo').textContent=itens+(itens===1?' item':' itens')+(CFG.precos?' \u2022 '+fmt(tot):'');
}
function mudar(p,d){
  const q=Math.max(0,(carrinho[p.id]||0)+d);
  carrinho[p.id]=q;qtdEls[p.id].textContent=q;atualizarBarra();
}
let zoomLista=[],zoomIdx=0;
function mostrarZoom(){
  document.getElementById('zoomimg').src=zoomLista[zoomIdx];
  const varias=zoomLista.length>1;
  document.getElementById('zprev').hidden=!varias;document.getElementById('znext').hidden=!varias;
  document.getElementById('zcont').textContent=varias?(zoomIdx+1)+' / '+zoomLista.length:'';
}
function abrirZoom(lista,i){zoomLista=lista;zoomIdx=i;mostrarZoom();document.getElementById('zoom').hidden=false;}
function passoZoom(d){zoomIdx=(zoomIdx+d+zoomLista.length)%zoomLista.length;mostrarZoom();}
function botaoSeta(txt,lado,fn){
  const b=document.createElement('button');b.className='seta '+lado;b.textContent=txt;
  b.onclick=ev=>{ev.stopPropagation();fn();};return b;
}
PRODUTOS.forEach(p=>{
  const card=document.createElement('div');card.className='card';
  card.dataset.busca=(p.nome+' '+p.desc).toLowerCase();
  const foto=document.createElement('div');foto.className='foto';
  if(p.fotos.length){
    let atual=0;
    const im=document.createElement('img');im.src=p.fotos[0];im.alt=p.nome;foto.appendChild(im);
    foto.onclick=()=>abrirZoom(p.fotos,atual);
    if(p.fotos.length>1){
      const pontos=document.createElement('div');pontos.className='pontos';
      const bolinhas=p.fotos.map(()=>{const b=document.createElement('i');pontos.appendChild(b);return b;});
      const ir=d=>{atual=(atual+d+p.fotos.length)%p.fotos.length;im.src=p.fotos[atual];bolinhas.forEach((b,k)=>{b.className=k===atual?'on':'';});};
      foto.append(botaoSeta('\u2039','e',()=>ir(-1)),botaoSeta('\u203A','d',()=>ir(1)),pontos);ir(0);
      let x0=null;
      foto.addEventListener('touchstart',ev=>{x0=ev.touches[0].clientX;},{passive:true});
      foto.addEventListener('touchend',ev=>{
        if(x0===null)return;const dx=ev.changedTouches[0].clientX-x0;x0=null;
        if(Math.abs(dx)>40)ir(dx<0?1:-1);
      });
    }
  }else{foto.textContent='\uD83D\uDCE6';foto.style.cursor='default';}
  const info=document.createElement('div');info.className='info';
  const n=document.createElement('div');n.className='nome';n.textContent=p.nome;info.appendChild(n);
  if(p.desc){const d=document.createElement('div');d.className='desc';d.textContent=p.desc;info.appendChild(d);}
  if(CFG.precos){const pr=document.createElement('div');pr.className='preco';pr.textContent=fmt(p.preco);info.appendChild(pr);}
  if(CFG.whatsapp){
    const c=document.createElement('div');c.className='qtd';
    const menos=document.createElement('button');menos.textContent='\u2212';menos.onclick=()=>mudar(p,-1);
    const q=document.createElement('span');q.textContent='0';qtdEls[p.id]=q;
    const mais=document.createElement('button');mais.textContent='+';mais.onclick=()=>mudar(p,1);
    c.append(menos,q,mais);info.appendChild(c);
  }
  card.append(foto,info);grade.appendChild(card);
});
function filtrar(){
  const t=document.getElementById('busca').value.trim().toLowerCase();
  let visiveis=0;
  grade.querySelectorAll('.card').forEach(c=>{const ok=!t||c.dataset.busca.includes(t);c.hidden=!ok;if(ok)visiveis++;});
  document.getElementById('vazio').hidden=visiveis>0;
}
document.getElementById('busca').oninput=filtrar;
document.getElementById('zoom').onclick=function(){this.hidden=true;};
document.getElementById('zprev').onclick=ev=>{ev.stopPropagation();passoZoom(-1);};
document.getElementById('znext').onclick=ev=>{ev.stopPropagation();passoZoom(1);};
document.onkeydown=ev=>{
  const z=document.getElementById('zoom');if(z.hidden)return;
  if(ev.key==='Escape')z.hidden=true;else if(ev.key==='ArrowLeft')passoZoom(-1);else if(ev.key==='ArrowRight')passoZoom(1);
};
document.getElementById('enviar').onclick=()=>{
  const linhas=['Ol\u00e1! Gostaria de fazer um pedido:',''];
  let tot=0;
  for(const p of PRODUTOS){
    const q=carrinho[p.id]||0;if(!q)continue;
    if(CFG.precos){tot+=q*p.preco;linhas.push('\u2022 '+q+'x '+p.nome+' - '+fmt(q*p.preco));}
    else linhas.push('\u2022 '+q+'x '+p.nome);
  }
  if(CFG.precos)linhas.push('','Total: '+fmt(tot));
  window.open('https://wa.me/'+CFG.whatsapp+'?text='+encodeURIComponent(linhas.join('\n')),'_blank');
};
filtrar();
</script>
</body></html>
